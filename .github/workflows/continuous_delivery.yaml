name: Continuous Delivery

on:
    push:
        branches:
            - develop

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Log in to registry
              uses: docker/login-action@v2
              with:
                registry: https://index.docker.io/v1/
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push container image to registry
              uses: docker/build-push-action@v3
              with:
                push: true
                tags: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/smartcity-trafego:${{ github.sha }}

    deploy:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Azure CLI Login
              uses: azure/login@v1
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Deploy Docker image to Web App
              run: |
                az webapp config container set \
                  --name smartcity-trafego \
                  --resource-group rs-fiap-on \
                  --docker-custom-image-name laispw/smartcity-trafego:${{ github.sha }} \
                  --docker-registry-server-url https://index.docker.io
