<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Ocorrências</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container py-4">
    <div id="menu-container"></div>
    <script>
    fetch('menu.html')
        .then(response => response.text())
        .then(data => document.getElementById('menu-container').innerHTML = data);
    </script>


    <h1 class="mb-4">Cadastro de Ocorrência</h1>

    <form id="ocorrencia-form" class="row g-3">
        <div class="col-md-6">
            <label for="tipoOcorrencia" class="form-label">Tipo</label>
            <input type="text" class="form-control" id="tipoOcorrencia" required>
        </div>
        <div class="col-md-6">
            <label for="descricao" class="form-label">Descrição</label>
            <input type="text" class="form-control" id="descricao" required>
        </div>
        <div class="col-md-6">
            <label for="dataHora" class="form-label">Data e Hora</label>
            <input type="datetime-local" class="form-control" id="dataHora" required>
        </div>
        <div class="col-md-6">
            <label for="localizacao" class="form-label">Localização</label>
            <input type="text" class="form-control" id="localizacao" required>
        </div>
        <div class="col-md-6">
            <label for="gravidade" class="form-label">Gravidade</label>
            <select class="form-control" id="gravidade">
                <option value="BAIXA">BAIXA</option>
                <option value="MODERADA">MODERADA</option>
                <option value="GRAVE">GRAVE</option>
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Cadastrar Ocorrência</button>
        </div>
    </form>

    <hr class="my-5">

    <div class="mb-3 d-flex">
        <input type="text" class="form-control me-2" id="search-id" placeholder="Buscar por ID">
        <button class="btn btn-outline-primary" onclick="buscarPorId()">Buscar</button>
        <button class="btn btn-outline-secondary ms-2" onclick="carregarOcorrencias()">Limpar</button>
    </div>
    

    <h2 class="mb-3">Lista de Ocorrências</h2>
    <table class="table table-bordered" id="ocorrencia-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tipo</th>
                <th>Descrição</th>
                <th>DataHora</th>
                <th>Localização</th>
                <th>Gravidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const apiUrl = 'http://localhost:8080/registro-ocorrencia';
        const form = document.getElementById('ocorrencia-form');
        const tableBody = document.querySelector('#ocorrencia-table tbody');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const tipoOcorrencia = document.getElementById('tipoOcorrencia').value;
            const descricao = document.getElementById('descricao').value;
            const dataHora = document.getElementById('dataHora').value;
            const localizacao = document.getElementById('localizacao').value;
            const gravidade = document.getElementById('gravidade').value;

            await fetch(apiUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ tipoOcorrencia, descricao, dataHora, localizacao, gravidade })
            });

            form.reset();
            carregarOcorrencias();
        });

        async function carregarOcorrencias() {
            const response = await fetch(apiUrl);
            const ocorrencias = await response.json();

            tableBody.innerHTML = '';
            ocorrencias.forEach(o => {
                const row = `
                    <tr>
                        <td>${o.id}</td>
                        <td>${o.tipoOcorrencia}</td>
                        <td>${o.descricao}</td>
                        <td>${o.dataHora}</td>
                        <td>${o.localizacao}</td>
                        <td>${o.gravidade}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deletarOcorrencia(${o.id})">Excluir</button>
                        </td>
                    </tr>`;
                tableBody.innerHTML += row;
            });
        }

        async function buscarPorId() {
            const id = document.getElementById('search-id').value;
            if (!id) return;

            const response = await fetch(`${apiUrl}/${id}`);
            if (!response.ok) {
                alert("Ocorrência não encontrada.");
                return;
            }

            const ocorrencia = await response.json();
            tableBody.innerHTML = `
                <tr>
                    <td>${ocorrencia.id}</td>
                    <td>${ocorrencia.tipoOcorrencia}</td>
                    <td>${ocorrencia.descricao}</td>
                    <td>${ocorrencia.dataHora}</td>
                    <td>${ocorrencia.localizacao}</td>
                    <td>${ocorrencia.gravidade}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="deletarOcorrencia(${ocorrencia.id})">Excluir</button>
                    </td>
                </tr>`;
        }


        async function deletarOcorrencia(id) {
            await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
            carregarOcorrencias();
        }

        carregarOcorrencias();
    </script>
</body>
</html>
