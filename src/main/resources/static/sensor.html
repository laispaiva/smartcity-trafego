<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Sensores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container py-4">
    <div id="menu-container"></div>
    <script>
    fetch('menu.html')
        .then(response => response.text())
        .then(data => document.getElementById('menu-container').innerHTML = data);
    </script>


    <h1 class="mb-4">Cadastro de Sensor</h1>

    <form id="sensor-form" class="row g-3">
        <div class="col-md-6">
            <label for="localizacao" class="form-label">Localização</label>
            <input type="text" class="form-control" id="localizacao" required>
        </div>
        <div class="col-md-6">
            <label for="status" class="form-label">Status</label>
            <select class="form-control" id="status">
                <option value="ATIVO">ATIVO</option>
                <option value="INATIVO">INATIVO</option>
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Cadastrar Sensor</button>
        </div>
    </form>

    <hr class="my-5">

    <h2 class="mb-3">Lista de Sensores</h2>
    <table class="table table-bordered" id="sensor-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Localização</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const apiUrl = 'http://localhost:8080/sensores'; // Altere para o endpoint em produção se necessário

        const form = document.getElementById('sensor-form');
        const tableBody = document.querySelector('#sensor-table tbody');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const localizacao = document.getElementById('localizacao').value;
            const status = document.getElementById('status').value;

            await fetch(apiUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ localizacao, status })
            });

            form.reset();
            carregarSensores();
        });

        async function carregarSensores() {
            const response = await fetch(apiUrl);
            const sensores = await response.json();

            tableBody.innerHTML = '';
            sensores.forEach(sensor => {
                const row = `
                    <tr>
                        <td>${sensor.id}</td>
                        <td>${sensor.localizacao}</td>
                        <td>${sensor.status}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deletarSensor(${sensor.id})">Excluir</button>
                        </td>
                    </tr>`;
                tableBody.innerHTML += row;
            });
        }

        async function deletarSensor(id) {
            await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
            carregarSensores();
        }

        carregarSensores();
    </script>
</body>
</html>
