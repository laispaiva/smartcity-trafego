<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Veículos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="container py-4">
    <div id="menu-container"></div>
    <script>
    fetch('menu.html')
        .then(response => response.text())
        .then(data => document.getElementById('menu-container').innerHTML = data);
    </script>


    <h1 class="mb-4">Cadastro de Veículo</h1>

    <form id="veiculo-form" class="row g-3">
        <div class="col-md-3">
            <label for="placa" class="form-label">Placa</label>
            <input type="text" class="form-control" id="placa" required>
        </div>
        <div class="col-md-3">
            <label for="tipo" class="form-label">Tipo</label>
            <input type="text" class="form-control" id="tipo" placeholder="ex: carro, moto, caminhão" required>
        </div>
        <div class="col-md-3">
            <label for="cor" class="form-label">Cor</label>
            <input type="text" class="form-control" id="cor" required>
        </div>
        <div class="col-md-3">
            <label for="velocidadeRegistrada" class="form-label">Velocidade</label>
            <input type="text" class="form-control" id="velocidadeRegistrada" placeholder="ex: 70km/h" required>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Cadastrar Veículo</button>
        </div>
    </form>

    <hr class="my-5">

    <h2 class="mb-3">Lista de Veículos</h2>
    <table class="table table-bordered" id="veiculo-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Placa</th>
                <th>Tipo</th>
                <th>Cor</th>
                <th>Velocidade</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        const apiUrl = 'http://localhost:8080/veiculos'; // Atualize para o domínio Azure se necessário

        const form = document.getElementById('veiculo-form');
        const tableBody = document.querySelector('#veiculo-table tbody');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const placa = document.getElementById('placa').value;
            const tipo = document.getElementById('tipo').value;
            const cor = document.getElementById('cor').value;
            const velocidadeRegistrada = document.getElementById('velocidadeRegistrada').value;

            await fetch(apiUrl, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ placa, tipo, cor, velocidadeRegistrada })
            });

            form.reset();
            carregarVeiculos();
        });

        async function carregarVeiculos() {
            const response = await fetch(apiUrl);
            const veiculos = await response.json();

            tableBody.innerHTML = '';
            veiculos.forEach(v => {
                const row = `
                    <tr>
                        <td>${v.id}</td>
                        <td>${v.placa}</td>
                        <td>${v.tipo}</td>
                        <td>${v.cor}</td>
                        <td>${v.velocidadeRegistrada}</td>
                        <td>
                            <button class="btn btn-danger btn-sm" onclick="deletarVeiculo(${v.id})">Excluir</button>
                        </td>
                    </tr>`;
                tableBody.innerHTML += row;
            });
        }

        async function deletarVeiculo(id) {
            await fetch(`${apiUrl}/${id}`, { method: 'DELETE' });
            carregarVeiculos();
        }

        carregarVeiculos();
    </script>
</body>
</html>
