services:
  db:
    container_name: mysql
    image: "mysql"
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=api
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PROFILE=dev
      - DATABASE_URL=jdbc:mysql://smartcity-trafego.mysql.database.azure.com:3306/api?useSSL=true&requireSSL=false&createDatabaseIfNotExist=true&serverTimezone=UTC
      - DATABASE_USER=laispw
      - DATABASE_PWD=1q2w3e4R
    depends_on:
      db:
        condition: service_healthy
